<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fund Trading Journal – Institutional Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- YOUR SAME UI (UNCHANGED) --- */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0b0f14;
            color: #e6edf3;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            padding: 20px;
        }

        .sidebar {
            background: #11161c;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #11161c;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: none;
            background: #1a222b;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #238636;
            color: white;
            cursor: pointer;
            font-weight: 600;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .delete-btn {
            background: #da3633;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: #1a222b;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #2a323c;
            text-align: center;
        }

        .green {
            color: #3fb950;
        }

        .red {
            color: #f85149;
        }

        h2 {
            margin-top: 0;
        }

        .section-title {
            grid-column: 1 / -1;
            text-align: left;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            background: #161b22;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .section-original {
            border-left: 4px solid #3fb950;
        }

        .section-model {
            border-left: 4px solid #58a6ff;
        }

        .stat-box {
            background: #161b22;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }

        .stat-box b {
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Add / Edit Trade</h2>

            <input id="symbol" placeholder="Symbol (BTCUSDT)">
            <select id="direction">
                <option value="LONG">LONG</option>
                <option value="SHORT">SHORT</option>
            </select>

            <input id="rr" type="number" step="0.01" placeholder="RR Result (1.5 / -1 / 0)">
            <input id="time" type="datetime-local">
            <input id="autoSession" placeholder="Session Auto-Detected" disabled>

            <button onclick="addTrade()">Save Trade</button>
        </div>

        <div class="main">

            <div class="card">
                <h2>Performance Overview</h2>
                <div class="stats" id="stats"></div>
            </div>

            <div class="chart-grid">
                <div class="card">
                    <h2>Equity Curve</h2>
                    <canvas id="equityChart"></canvas>
                </div>

                <div class="card">
                    <h2>1:1 Model Equity Curve</h2>
                    <canvas id="oneOneChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h2>Trade History</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Dir</th>
                            <th>RR</th>
                            <th>Session</th>
                            <th>UTC Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tradeTable"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        let trades = JSON.parse(localStorage.getItem("trades")) || [];
        let editIndex = -1;

        function detectSession(utcDate) {
            const hour = utcDate.getUTCHours();
            if (hour < 8) return "Asia";
            if (hour < 13) return "London";
            if (hour <= 16) return "London/NY Overlap";
            return "New York";
        }

        document.getElementById("time").addEventListener("change", function () {
            if (this.value) {
                document.getElementById("autoSession").value =
                    detectSession(new Date(this.value));
            }
        });

        let equityChart = new Chart(document.getElementById("equityChart"), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Equity', data: [], borderColor: '#3fb950', tension: 0.3 }] }
        });

        let oneOneChart = new Chart(document.getElementById("oneOneChart"), {
            type: 'line',
            data: { labels: [], datasets: [{ label: '1:1 Equity', data: [], borderColor: '#58a6ff', tension: 0.3 }] }
        });

        function saveTrades() {
            localStorage.setItem("trades", JSON.stringify(trades));
        }

        function addTrade() {
            const symbol = document.getElementById("symbol").value;
            const direction = document.getElementById("direction").value;
            const rr = parseFloat(document.getElementById("rr").value);
            const timeInput = document.getElementById("time").value;

            if (!symbol || isNaN(rr) || !timeInput) return alert("Fill all fields");

            const utcDate = new Date(timeInput);
            const session = detectSession(utcDate);

            const tradeData = { symbol, direction, rr, session, time: utcDate.toISOString() };

            if (editIndex === -1) trades.push(tradeData);
            else { trades[editIndex] = tradeData; editIndex = -1; }

            saveTrades();
            clearForm();
            render();
        }

        function editTrade(index) {
            const t = trades[index];
            document.getElementById("symbol").value = t.symbol;
            document.getElementById("direction").value = t.direction;
            document.getElementById("rr").value = t.rr;
            document.getElementById("time").value = t.time.slice(0, 16);
            document.getElementById("autoSession").value = t.session;
            editIndex = index;
        }

        function deleteTrade(index) {
            if (confirm("Delete this trade?")) {
                trades.splice(index, 1);
                saveTrades();
                render();
            }
        }

        function clearForm() {
            document.getElementById("symbol").value = "";
            document.getElementById("rr").value = "";
            document.getElementById("time").value = "";
            document.getElementById("autoSession").value = "";
        }

        function render() {

            const table = document.getElementById("tradeTable");
            table.innerHTML = "";

            let equity = 0;
            let modelEquity = 0;
            let peak = 0;
            let maxDD = 0;
            let streak = 0;
            let maxStreak = 0;

            let equityData = [0];
            let modelData = [0];
            let labels = [0];

            trades.forEach((t, i) => {

                equity += t.rr;
                equityData.push(equity);
                labels.push(i + 1);

                let modelRR = (t.rr < 0) ? -1 : 1;
                modelEquity += modelRR;
                modelData.push(modelEquity);

                if (equity > peak) peak = equity;
                let dd = peak - equity;
                if (dd > maxDD) maxDD = dd;

                if (t.rr < 0) {
                    streak++;
                    if (streak > maxStreak) maxStreak = streak;
                } else streak = 0;

                table.innerHTML += `
<tr>
<td>${t.symbol}</td>
<td>${t.direction}</td>
<td class="${t.rr >= 0 ? 'green' : 'red'}">${t.rr}</td>
<td>${t.session}</td>
<td>${t.time}</td>
<td>
<button onclick="editTrade(${i})">Edit</button>
<button onclick="deleteTrade(${i})" class="delete-btn">Delete</button>
</td>
</tr>`;
            });

            let finalEquity = equityData[equityData.length - 1];
            let finalModelEquity = modelData[modelData.length - 1];

            equityChart.data.labels = labels;
            equityChart.data.datasets[0].data = equityData;
            equityChart.data.datasets[0].borderColor = finalEquity >= 0 ? '#3fb950' : '#f85149';
            equityChart.update();

            oneOneChart.data.labels = labels;
            oneOneChart.data.datasets[0].data = modelData;
            oneOneChart.data.datasets[0].borderColor = finalModelEquity >= 0 ? '#3fb950' : '#f85149';
            oneOneChart.update();

            calculateStats(maxDD, maxStreak);
        }

        function calculateStats(maxDD, maxStreak) {

            if (trades.length === 0) {
                document.getElementById("stats").innerHTML = "";
                return;
            }

            let total = trades.length;

            /* =========================
               ORIGINAL STRATEGY
            ========================== */

            let wins = trades.filter(t => t.rr > 0);
            let losses = trades.filter(t => t.rr < 0);

            let winRate = (wins.length / total) * 100;
            let avgRR = trades.reduce((a, b) => a + b.rr, 0) / total;

            let profitFactor = Math.abs(
                wins.reduce((a, b) => a + b.rr, 0) /
                (losses.reduce((a, b) => a + b.rr, 0) || 1)
            );

            let sessionProfit = {};
            let weekend = 0, weekday = 0;
            let longProfit = 0, shortProfit = 0;

            trades.forEach(t => {

                if (!sessionProfit[t.session]) sessionProfit[t.session] = 0;
                sessionProfit[t.session] += t.rr;

                let day = new Date(t.time).getUTCDay();
                if (day === 0 || day === 6) weekend += t.rr;
                else weekday += t.rr;

                if (t.direction === "LONG") longProfit += t.rr;
                if (t.direction === "SHORT") shortProfit += t.rr;
            });

            let bestSession = Object.keys(sessionProfit)
                .reduce((a, b) => sessionProfit[a] > sessionProfit[b] ? a : b);

            let worstSession = Object.keys(sessionProfit)
                .reduce((a, b) => sessionProfit[a] < sessionProfit[b] ? a : b);

            let bestDirection = longProfit > shortProfit ? "LONG" : "SHORT";


            /* =========================
               1:1 MODEL
            ========================== */

            let modelEquity = 0;
            let modelPeak = 0;
            let modelMaxDD = 0;
            let modelStreak = 0;
            let modelMaxStreak = 0;

            let modelWins = 0;

            let modelSessionProfit = {};
            let modelWeekend = 0, modelWeekday = 0;
            let modelLongProfit = 0, modelShortProfit = 0;

            trades.forEach(t => {

                let modelRR = (t.rr < 0) ? -1 : 1;

                if (modelRR > 0) modelWins++;

                modelEquity += modelRR;

                if (modelEquity > modelPeak) modelPeak = modelEquity;
                let dd = modelPeak - modelEquity;
                if (dd > modelMaxDD) modelMaxDD = dd;

                if (modelRR < 0) {
                    modelStreak++;
                    if (modelStreak > modelMaxStreak) modelMaxStreak = modelStreak;
                } else modelStreak = 0;

                if (!modelSessionProfit[t.session]) modelSessionProfit[t.session] = 0;
                modelSessionProfit[t.session] += modelRR;

                let day = new Date(t.time).getUTCDay();
                if (day === 0 || day === 6) modelWeekend += modelRR;
                else modelWeekday += modelRR;

                if (t.direction === "LONG") modelLongProfit += modelRR;
                if (t.direction === "SHORT") modelShortProfit += modelRR;
            });

            let modelWinRate = (modelWins / total) * 100;

            let modelBestSession = Object.keys(modelSessionProfit)
                .reduce((a, b) => modelSessionProfit[a] > modelSessionProfit[b] ? a : b);

            let modelWorstSession = Object.keys(modelSessionProfit)
                .reduce((a, b) => modelSessionProfit[a] < modelSessionProfit[b] ? a : b);

            let modelBestDirection = modelLongProfit > modelShortProfit ? "LONG" : "SHORT";


            /* =========================
               DISPLAY
            ========================== */

            document.getElementById("stats").innerHTML = `

<div class="section-title section-original">ORIGINAL STRATEGY</div>

<div class="stat-box">Total Trades<br><b>${total}</b></div>
<div class="stat-box">Win Rate<br><b>${winRate.toFixed(1)}%</b></div>
<div class="stat-box">Average RR<br><b>${avgRR.toFixed(2)}</b></div>
<div class="stat-box">Profit Factor<br><b>${profitFactor.toFixed(2)}</b></div>
<div class="stat-box">Max Drawdown<br><b>${maxDD.toFixed(2)}</b></div>
<div class="stat-box">Longest Losing Streak<br><b>${maxStreak}</b></div>
<div class="stat-box">Best Session<br><b>${bestSession}</b></div>
<div class="stat-box">Worst Session<br><b>${worstSession}</b></div>
<div class="stat-box">Weekend PnL<br><b>${weekend.toFixed(2)}</b></div>
<div class="stat-box">Weekday PnL<br><b>${weekday.toFixed(2)}</b></div>
<div class="stat-box">Most Profitable Direction<br><b>${bestDirection}</b></div>

<div class="section-title section-model">1:1 MODEL</div>

<div class="stat-box">Win Rate<br><b>${modelWinRate.toFixed(1)}%</b></div>
<div class="stat-box">Max Drawdown<br><b>${modelMaxDD.toFixed(2)}</b></div>
<div class="stat-box">Longest Losing Streak<br><b>${modelMaxStreak}</b></div>
<div class="stat-box">Best Session<br><b>${modelBestSession}</b></div>
<div class="stat-box">Worst Session<br><b>${modelWorstSession}</b></div>
<div class="stat-box">Weekend PnL<br><b>${modelWeekend.toFixed(2)}</b></div>
<div class="stat-box">Weekday PnL<br><b>${modelWeekday.toFixed(2)}</b></div>
<div class="stat-box">Most Profitable Direction<br><b>${modelBestDirection}</b></div>
`;
        }

        render();
    </script>



</body>

</html>
